<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suture · AI Gate 配置体检</title>
<style>
  :root {
    --bg: #FAF9F5;
    --surface: #FFFFFF;
    --surface-alt: #F0EEE6;
    --ink: #141413;
    --ink-muted: #6B6B68;
    --border: #E8E6DE;
    --accent: #D97757;
    --accent-hover: #C4664A;
    --accent-soft: #F7E9E2;
    --success: #2C7A55;
    --success-soft: #E3F1E9;
    --warning: #9A6B1F;
    --warning-soft: #F7EDD9;
    --danger: #B3261E;
    --danger-soft: #FBE7E5;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius-card: 12px;
    --radius-ctl: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1B19; --surface: #242422; --surface-alt: #2C2C29;
      --ink: #F0EEE6; --ink-muted: #A3A29C; --border: #38382F;
      --accent: #E08A6B; --accent-hover: #EC9C7E; --accent-soft: #3A2A22;
      --success: #6BBF92; --success-soft: #1D3328;
      --warning: #D9AC63; --warning-soft: #35291444;
      --danger: #E8796F; --danger-soft: #3A1F1D;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-ui); font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 40px 24px 72px; }
  header { margin-bottom: 28px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-muted); font-size: 0.88rem; margin: 0; }
  .mono { font-family: var(--font-mono); }

  .statusbar {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: 16px 18px; margin-bottom: 20px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-muted); flex: none; }
  .dot.ok { background: var(--success); }
  .dot.warn { background: var(--warning); }
  .dot.bad { background: var(--danger); }
  .dot.busy { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
  .statusbar .text { flex: 1; min-width: 0; }
  .statusbar .title { font-weight: 600; }
  .statusbar .detail { color: var(--ink-muted); font-size: 0.86rem; }

  button {
    font: inherit; border-radius: var(--radius-ctl); padding: 9px 18px;
    cursor: pointer; border: 1px solid transparent; transition: background .12s ease;
  }
  button:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:not(:disabled):hover { background: var(--accent-hover); }
  .btn-secondary { background: transparent; color: var(--ink); border-color: var(--border); }
  .btn-secondary:not(:disabled):hover { background: var(--surface-alt); }
  .choice-list {
    display: flex; flex-direction: column; gap: 1px; margin-top: 8px;
    max-height: 220px; overflow-y: auto; border: 1px solid var(--border);
    border-radius: var(--radius-ctl); background: var(--border);
  }
  .btn-choice-row {
    display: block; width: 100%; text-align: left; border-radius: 0;
    background: var(--surface); color: var(--ink);
    padding: 8px 14px; font-size: 0.86rem; border-color: transparent;
  }
  .btn-choice-row:not(:disabled):hover { background: var(--accent-soft); color: var(--accent-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 4px; }
  .card .files { color: var(--ink-muted); font-size: 0.82rem; margin-bottom: 14px; }
  .card .files div { overflow-wrap: anywhere; }

  .pill {
    display: inline-block; font-size: 0.74rem; padding: 2px 9px;
    border-radius: 999px; white-space: nowrap; font-family: var(--font-mono);
  }
  .pill.ok { background: var(--success-soft); color: var(--success); }
  .pill.issue { background: var(--warning-soft); color: var(--warning); }
  .pill.manual { background: var(--danger-soft); color: var(--danger); }

  .item {
    display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border);
  }
  .item:first-of-type { border-top: none; }
  .item .body { flex: 1; min-width: 0; }
  .item .label { font-weight: 600; }
  .item .detail { color: var(--ink-muted); overflow-wrap: anywhere; }
  .item .kv { font-family: var(--font-mono); font-size: 0.82rem; margin-top: 3px; overflow-wrap: anywhere; }
  .item .kv span { color: var(--ink-muted); }
  .note { color: var(--ink-muted); font-size: 0.82rem; margin-top: 3px; }

  .steps { margin: 14px 0 0; padding: 0; list-style: none; }
  .steps li { padding: 7px 0 7px 22px; position: relative; color: var(--ink-muted); }
  .steps li::before {
    content: ""; position: absolute; left: 4px; top: 15px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  }
  .result {
    margin-top: 16px; padding: 14px 16px; border-radius: var(--radius-ctl);
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    white-space: pre-line;
  }
  .result.ok { border-color: var(--success); background: var(--success-soft); }
  .result.warn { border-color: var(--warning); background: var(--warning-soft); }
  .result.bad { border-color: var(--danger); background: var(--danger-soft); }
  .foot { color: var(--ink-muted); font-size: 0.8rem; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Suture</h1>
    <p class="sub" id="sub">AI Gate 配置体检与一键修复</p>
  </header>

  <div class="statusbar">
    <div class="dot" id="dot"></div>
    <div class="text">
      <div class="title" id="statusTitle">准备就绪</div>
      <div class="detail" id="statusDetail">点「开始检查」，先测网关是否正常，再检查本机配置。</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="btnCheck">开始检查</button>
  </div>

  <div id="results"></div>
  <p class="foot" id="foot"></p>
</div>

<script>
const TOKEN = "__SUTURE_TOKEN__";
const $ = (id) => document.getElementById(id);

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", "X-Suture-Token": TOKEN },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "请求失败");
  return data;
}

function setStatus(kind, title, detail) {
  $("dot").className = "dot " + kind;
  $("statusTitle").textContent = title;
  $("statusDetail").textContent = detail || "";
}

// 阶段一（网关本身通不通）跟阶段二（每个客户端逐一体检，在下面的卡片里）是
// 同一份报告里前后相接的两件事，视觉上也该是同一种"卡片"，不能一个是细文字行、
// 一个是大卡片——那样即使同一次点击、同一次请求返回，看着也像两份不相关的东西。
function probeCard(p, gatewayDown) {
  const card = el("div", "card");
  const head = el("div");
  head.style.cssText = "display:flex;align-items:center;gap:10px;margin-bottom:2px";
  const title = el("h2", null, "网关连通性");
  title.style.margin = "0";
  head.appendChild(title);
  const ok = p.classification === "ok";
  head.appendChild(el("span", "pill " + (ok ? "ok" : "issue"), ok ? "正常" : "异常"));
  card.appendChild(head);
  card.appendChild(el("div", "detail", `${p.detail}（${p.elapsed_ms}ms）`));
  if (p.classification === "auth_error" && !gatewayDown) {
    card.appendChild(el("div", "note", "网关返回鉴权错误，这更可能是本地配置的问题，已继续检查本地配置。"));
  }
  return card;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function findingRow(f, harnessId, card) {
  const row = el("div", "item");
  row.appendChild(el("div", "dot " + (f.ok ? "ok" : "warn")));
  const body = el("div", "body");
  body.appendChild(el("div", "label", f.label));
  body.appendChild(el("div", "detail", f.detail));
  if (f.current_value || f.suggested_value) {
    const kv = el("div", "kv");
    if (f.current_value) {
      kv.appendChild(el("span", null, "当前值："));
      kv.appendChild(document.createTextNode(f.current_value + "  "));
    }
    if (f.suggested_value && !f.ok) {
      kv.appendChild(el("span", null, "建议值："));
      kv.appendChild(document.createTextNode(f.suggested_value));
    }
    body.appendChild(kv);
  }
  if (f.note) body.appendChild(el("div", "note", f.note));
  // 有候选值、但 Suture 不该替用户挑的场景：摆成一排可以点的选项，
  // 不是自动填、也不是纯文字——点哪个才写哪个。
  // 已经判定正常、但仍然给了候选值的项（比如「没指定模型，不填也能用」），菜单照样渲染，
  // 只不过这一项本身待在「另外 N 项检查通过」的折叠区里，默认收起——想指定的人点开再选，
  // 不会一上来就把几十个型号平铺在报告里当成报错。
  if (f.choices && f.choices.length && f.fix_field) {
    const menu = el("div", "choice-list");
    f.choices.forEach((c) => {
      const btn = el("button", "btn-choice-row", c.label);
      btn.type = "button";
      btn.onclick = () => applyChoice(harnessId, f.fix_field, c.value, btn, menu, card);
      menu.appendChild(btn);
    });
    body.appendChild(menu);
  }
  row.appendChild(body);
  return row;
}

async function applyChoice(harnessId, field, value, btn, menu, card) {
  const originalLabel = btn.textContent;
  Array.from(menu.children).forEach((b) => (b.disabled = true));
  btn.textContent = "正在应用…";
  setStatus("busy", "正在应用你的选择", "备份原配置 → 写入 → 用修正后的配置重新验证");
  try {
    const r = await api("/api/apply_choice", { harness_id: harnessId, field, value });
    const steps = el("ul", "steps");
    (r.steps || []).forEach((s) => steps.appendChild(el("li", null, s.detail)));
    card.appendChild(steps);
    const kind = r.result === "fixed" ? "ok" : (r.result === "kept_fix" ? "warn" : "bad");
    card.appendChild(el("div", "result " + kind, r.message));
    setStatus(kind === "ok" ? "ok" : (kind === "warn" ? "warn" : "bad"),
      { fixed: "已应用", kept_fix: "已应用（保留）", rolled_back: "已回滚" }[r.result] || "已处理",
      r.message);
    menu.remove();
  } catch (e) {
    card.appendChild(el("div", "result bad", e.message));
    Array.from(menu.children).forEach((b) => (b.disabled = false));
    btn.textContent = originalLabel;
  }
}

const RESULT_LABEL = {
  healthy: ["ok", "一切正常"],
  issues: ["issue", "发现问题"],
  manual: ["manual", "需人工处理"],
  no_config: ["issue", "还没配置过"],
};

function harnessCard(h) {
  const card = el("div", "card");
  const head = el("div");
  head.style.cssText = "display:flex;align-items:center;gap:10px;margin-bottom:2px";
  const title = el("h2", null, h.display_name);
  title.style.margin = "0";
  head.appendChild(title);
  const [cls, text] = RESULT_LABEL[h.result] || ["issue", h.result];
  head.appendChild(el("span", "pill " + cls, text));
  card.appendChild(head);

  const files = el("div", "files");
  h.files.forEach((f) => {
    let state = f.exists ? "存在" : "不存在（该层未配置）";
    if (f.exists && !f.active) state = "存在但不生效";
    files.appendChild(el("div", null, `${f.layer}：${f.path} —— ${state}`));
  });
  card.appendChild(files);

  if (h.result === "no_config") {
    card.appendChild(el("div", "detail", "没有找到任何配置——这不是配错了，是还没配置过。"));
    const btn = el("button", "btn-primary", "帮我生成一份配置");
    btn.style.marginTop = "12px";
    const originalLabel = btn.textContent;
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = "正在生成…";
      try {
        const r = await api("/api/generate", { harness_id: h.harness_id });
        const box = el("div", "result ok", `已生成：${r.path}\n请将其中的 Key 替换为网关后台生成的真实值。`);
        card.appendChild(box);
        btn.remove();
      } catch (e) {
        card.appendChild(el("div", "result bad", e.message));
        btn.disabled = false;
        btn.textContent = originalLabel;
      }
    };
    card.appendChild(btn);
    return card;
  }

  const issues = h.findings.filter((f) => !f.ok);
  const oks = h.findings.filter((f) => f.ok);
  issues.forEach((f) => card.appendChild(findingRow(f, h.harness_id, card)));
  if (oks.length) {
    const more = el("details");
    more.style.marginTop = "10px";
    const sum = el("summary", null, `另外 ${oks.length} 项检查通过`);
    sum.style.cssText = "cursor:pointer;color:var(--ink-muted);font-size:.86rem";
    more.appendChild(sum);
    oks.forEach((f) => more.appendChild(findingRow(f, h.harness_id, card)));
    card.appendChild(more);
  }
  (h.infos || []).forEach((t) => card.appendChild(el("div", "note", t)));
  const e2eResults = h.e2e_results && h.e2e_results.length ? h.e2e_results : (h.e2e ? [h.e2e] : []);
  e2eResults.forEach((r) => {
    const label = e2eResults.length > 1 ? `端到端真实请求（模型 ${r.model}）` : "端到端真实请求";
    card.appendChild(el("div", "note", `${label}：${r.detail}（${r.elapsed_ms}ms）`));
  });

  if (h.fixable_count > 0) {
    const btn = el("button", "btn-primary", `一键修复（${h.fixable_count} 项）`);
    btn.style.marginTop = "14px";
    btn.onclick = () => runFix(h, card, btn);
    card.appendChild(btn);
  }
  return card;
}

async function runFix(h, card, btn) {
  btn.disabled = true;
  btn.textContent = "正在修复…";
  setStatus("busy", "正在修复", "备份原配置 → 写入修正值 → 用修正后的配置重新验证");
  try {
    const r = await api("/api/fix", { harness_id: h.harness_id });
    const steps = el("ul", "steps");
    (r.steps || []).forEach((s) => steps.appendChild(el("li", null, s.detail)));
    card.appendChild(steps);
    const kind = r.result === "fixed" ? "ok" : (r.result === "kept_fix" ? "warn" : "bad");
    card.appendChild(el("div", "result " + kind, r.message));
    setStatus(kind === "ok" ? "ok" : (kind === "warn" ? "warn" : "bad"),
      { fixed: "修复成功", kept_fix: "修复已保留", rolled_back: "已回滚" }[r.result] || "修复结束",
      r.message);
    btn.remove();
  } catch (e) {
    card.appendChild(el("div", "result bad", e.message));
    btn.disabled = false;
    btn.textContent = "重试修复";
  }
}

async function check() {
  $("btnCheck").disabled = true;
  $("results").innerHTML = "";
  setStatus("busy", "正在检查", "阶段一：测试网关连通性…");
  try {
    const report = await api("/api/check", {});
    const p = report.gateway_probe;
    if (report.result === "no_harness") {
      setStatus("warn", "没有探测到支持的客户端", report.message);
      return;
    }
    if (report.result === "gateway_down") {
      setStatus("bad", "网关侧问题，未检查本机配置", report.message);
      if (p) $("results").appendChild(probeCard(p, true));
      $("results").appendChild(el("div", "result warn", report.message));
      return;
    }
    const summary = {
      healthy: ["ok", "检查通过"],
      issues: ["warn", "发现可修复的问题"],
      manual: ["warn", "需要人工处理"],
      no_config: ["warn", "还没配置过"],
    }[report.result] || ["warn", "检查完成"];
    setStatus(summary[0], summary[1], report.message || "");
    if (p) $("results").appendChild(probeCard(p, false));
    report.harnesses.forEach((h) => $("results").appendChild(harnessCard(h)));
  } catch (e) {
    setStatus("bad", "检查失败", e.message);
  } finally {
    $("btnCheck").disabled = false;
    $("btnCheck").textContent = "重新检查";
  }
}

$("btnCheck").onclick = check;

api("/api/state").then((s) => {
  $("sub").textContent =
    `${s.gateway_name} 配置体检 · 已探测到 ${s.installed.map((i) => i.name).join("、") || "无支持的客户端"}`;
  $("foot").textContent = `规则来源：${s.profile_source} · 网关当前接入 ${s.model_count} 个型号`;
}).catch(() => {});
</script>
</body>
</html>
