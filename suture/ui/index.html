<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suture · AI Gate 连通体检</title>
<style>
  :root {
    --bg: #FAF9F5;
    --surface: #FFFFFF;
    --surface-alt: #F0EEE6;
    --ink: #141413;
    --ink-muted: #6B6B68;
    --border: #E8E6DE;
    --accent: #D97757;
    --accent-hover: #C4664A;
    --accent-soft: #F7E9E2;
    --success: #2C7A55;
    --success-soft: #E3F1E9;
    --warning: #9A6B1F;
    --warning-soft: #F7EDD9;
    --danger: #B3261E;
    --danger-soft: #FBE7E5;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius-card: 12px;
    --radius-ctl: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1B19; --surface: #242422; --surface-alt: #2C2C29;
      --ink: #F0EEE6; --ink-muted: #A3A29C; --border: #38382F;
      --accent: #E08A6B; --accent-hover: #EC9C7E; --accent-soft: #3A2A22;
      --success: #6BBF92; --success-soft: #1D3328;
      --warning: #D9AC63; --warning-soft: #352914;
      --danger: #E8796F; --danger-soft: #3A1F1D;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-ui); font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 22px 64px; }
  header { margin-bottom: 18px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-muted); font-size: 0.88rem; margin: 0; }
  .mono { font-family: var(--font-mono); }

  /* ---- 顶部 Tab 导航 ---- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab {
    font: inherit; font-size: 0.95rem; padding: 9px 16px; cursor: pointer;
    border: none; background: transparent; color: var(--ink-muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 0;
  }
  .tab.active { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .panel { display: none; }
  .panel.active { display: block; }

  button { font: inherit; border-radius: var(--radius-ctl); cursor: pointer; border: 1px solid transparent; }
  button:disabled { opacity: .55; cursor: default; }
  .btn-primary { background: var(--accent); color: #fff; padding: 11px 22px; }
  .btn-primary:not(:disabled):hover { background: var(--accent-hover); }
  .btn-secondary { background: transparent; color: var(--ink); border-color: var(--border); padding: 8px 14px; }
  .btn-secondary:not(:disabled):hover { background: var(--surface-alt); }
  .btn-sm { padding: 7px 14px; font-size: 0.86rem; }
  .btn-block { display: block; width: 100%; margin-top: 14px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .actions { margin: 4px 0 16px; }

  .statusbar {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: 14px 16px; margin-bottom: 18px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-muted); flex: none; }
  .dot.ok { background: var(--success); }
  .dot.warn { background: var(--warning); }
  .dot.bad { background: var(--danger); }
  .dot.busy { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
  .statusbar .text { flex: 1; min-width: 0; }
  .statusbar .title { font-weight: 600; }
  .statusbar .detail { color: var(--ink-muted); font-size: 0.86rem; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: 16px 18px; margin-bottom: 14px;
  }
  .chead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .cname { font-weight: 600; font-size: 1.02rem; }
  .cstate { margin-left: auto; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.78rem; font-weight: 600; padding: 3px 10px;
    border-radius: 999px; white-space: nowrap;
  }
  .pill.ok { background: var(--success-soft); color: var(--success); }
  .pill.warn { background: var(--warning-soft); color: var(--warning); }
  .pill.bad { background: var(--danger-soft); color: var(--danger); }
  .pill.muted { background: var(--surface-alt); color: var(--ink-muted); }
  .checkmark { font-size: 0.9rem; }

  .cbody { color: var(--ink-muted); font-size: 0.92rem; }
  .cbody .lead { color: var(--ink); margin: 0 0 4px; }

  .issue { border-top: 1px solid var(--border); padding: 12px 0; }
  .issue:first-child { border-top: none; }
  .ititle { font-weight: 600; color: var(--ink); }
  .idetail { color: var(--ink-muted); font-size: 0.9rem; margin-top: 2px; overflow-wrap: anywhere; }
  .ictl { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  input[type="password"], input[type="text"], select {
    font: inherit; padding: 8px 10px; border-radius: var(--radius-ctl);
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    min-width: 220px;
  }
  select { cursor: pointer; }

  .rowlink {
    background: none; border: none; color: var(--ink-muted);
    text-decoration: underline; padding: 0; cursor: pointer; font-size: 0.86rem;
  }
  .rowlink:hover { color: var(--accent); }

  .note { color: var(--ink-muted); font-size: 0.86rem; margin-top: 4px; }
  .note code { font-family: var(--font-mono); background: var(--surface-alt); padding: 1px 5px; border-radius: 4px; }

  .result {
    margin-top: 12px; padding: 11px 14px; border-radius: var(--radius-ctl);
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    font-size: 0.9rem; white-space: pre-line; overflow-wrap: anywhere;
  }
  .result.ok { border-color: var(--success); background: var(--success-soft); }
  .result.warn { border-color: var(--warning); background: var(--warning-soft); }
  .result.bad { border-color: var(--danger); background: var(--danger-soft); }

  .configpanel {
    margin-top: 12px; padding: 14px; border: 1px solid var(--border);
    border-radius: var(--radius-ctl); background: var(--surface-alt);
    display: flex; flex-direction: column; gap: 10px;
  }
  .configpanel label { font-size: 0.86rem; color: var(--ink-muted); display: flex; flex-direction: column; gap: 4px; }
  .codebox {
    font-family: var(--font-mono); font-size: 0.85rem; white-space: pre-wrap;
    overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-ctl); padding: 10px 12px; margin: 6px 0;
  }
  .outbox {
    font-family: var(--font-mono); font-size: 0.82rem; white-space: pre-wrap;
    overflow-wrap: anywhere; max-height: 260px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-ctl); padding: 10px 12px; margin-top: 10px; color: var(--ink);
  }
  .outbox.err { border-color: var(--danger); }
  .foot { color: var(--ink-muted); font-size: 0.8rem; margin-top: 26px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Suture</h1>
    <p class="sub" id="sub">加载中…</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" id="tabBtnCheck" role="tab">检查</button>
    <button class="tab" id="tabBtnInstall" role="tab">安装 / 上手</button>
  </nav>

  <!-- ============ 检查 Tab ============ -->
  <section class="panel active" id="panelCheck">
    <div class="actions">
      <button class="btn-primary" id="btnCheck">开始检查</button>
    </div>

    <div class="statusbar" id="statusbar">
      <div class="dot" id="dot"></div>
      <div class="text">
        <div class="title" id="statusTitle">准备就绪</div>
        <div class="detail" id="statusDetail">点「开始检查」，看看这几个客户端能不能连上 AI Gate。</div>
      </div>
    </div>

    <div id="results"></div>
  </section>

  <!-- ============ 安装 / 上手 Tab ============ -->
  <section class="panel" id="panelInstall">
    <p class="sub" style="margin:0 0 14px">
      本机还没装或还不会用的客户端，在这里装好、配好网关，就能回去「检查」。
    </p>
    <div id="installList"></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script>
const TOKEN = "__SUTURE_TOKEN__";
const $ = (id) => document.getElementById(id);
const STATE = { models: [], clients: [] };      // /api/state 的静态信息
let lastReport = null;                          // 最近一次 /api/check 的报告

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "Content-Type": "application/json", "X-Suture-Token": TOKEN },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "请求失败");
  return data;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function setStatus(kind, title, detail) {
  $("dot").className = "dot " + kind;
  $("statusTitle").textContent = title;
  $("statusDetail").textContent = detail || "";
}

/* ---------------- 页面级状态 ---------------- */

const STATE_UI = {
  connected:    ["ok",   "可以连接"],
  blocked:      ["bad",  "连不上"],
  unconfigured: ["warn", "还没配置"],
  not_installed:["warn", "还没安装"],
};

function statePill(client) {
  const [cls, label] = STATE_UI[client.state] || ["muted", client.state_label || client.state];
  const pill = el("span", "pill " + cls);
  if (client.state === "connected") {
    pill.appendChild(el("span", "checkmark", "✓"));
    pill.appendChild(document.createTextNode(label));
  } else {
    pill.textContent = label;
  }
  return pill;
}

function modelOptions() {
  return STATE.models.map((m) => {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.display || m.id;
    return opt;
  });
}

/* ---------------- 检查 Tab：客户端卡片 ---------------- */

function actionControl(client, issue) {
  const kind = issue.repair_kind;
  const wrap = el("div", "ictl");
  if (kind === "auto") {
    const b = el("button", "btn-primary btn-sm", "修复");
    b.dataset.act = "fix"; b.dataset.issue = issue.id;
    wrap.appendChild(b);
  } else if (kind === "choice") {
    const sel = el("select");
    sel.dataset.ctl = "choiceSel";
    (issue.choices || []).forEach((c) => {
      const opt = document.createElement("option");
      opt.value = c.value; opt.textContent = c.label;
      sel.appendChild(opt);
    });
    if (!sel.options.length) {
      STATE.models.forEach((m) => {
        const opt = document.createElement("option");
        opt.value = m.id; opt.textContent = m.display || m.id;
        sel.appendChild(opt);
      });
    }
    const b = el("button", "btn-primary btn-sm", "应用选择");
    b.dataset.act = "choice"; b.dataset.issue = issue.id;
    wrap.append(el("span", "note", "从网关支持的型号里选一个："), sel, b);
  } else if (kind === "input") {
    const inp = document.createElement("input");
    inp.type = "password"; inp.placeholder = "粘贴 Key…";
    inp.dataset.ctl = "keyInput";
    if (issue.prompt) inp.title = issue.prompt;
    const b = el("button", "btn-primary btn-sm", "保存 Key");
    b.dataset.act = "input"; b.dataset.issue = issue.id;
    wrap.append(inp, b);
  } else {
    // external / none：在工具外处理，不提供按钮
    wrap.appendChild(el("div", "note", "这一项需要在 Suture 之外处理。"));
  }
  return wrap;
}

function issueRow(client, issue) {
  const row = el("div", "issue");
  row.appendChild(el("div", "ititle", issue.title || issue.id));
  row.appendChild(el("div", "idetail", issue.detail || ""));
  row.appendChild(actionControl(client, issue));
  return row;
}

function configurePanel() {
  const panel = el("div", "configpanel");
  const lblModel = el("label", null, "默认模型");
  const sel = el("select");
  sel.dataset.ctl = "cfgModel";
  modelOptions().forEach((o) => sel.appendChild(o));
  lblModel.appendChild(sel);

  const lblKey = el("label", null, "网关 Key（在 AI Gate 后台生成）");
  const keyInp = document.createElement("input");
  keyInp.type = "password"; keyInp.placeholder = "粘贴 Key…"; keyInp.dataset.ctl = "cfgKey";
  lblKey.appendChild(keyInp);

  const row = el("div", "ictl");
  const save = el("button", "btn-primary btn-sm", "保存并测试");
  save.dataset.act = "configure";
  const cancel = el("button", "btn-secondary btn-sm", "收起");
  cancel.dataset.act = "toggle-config";
  row.append(save, cancel);

  panel.append(lblModel, lblKey, row);
  return panel;
}

function cardBody(client) {
  const body = el("div", "cbody");
  if (client.state === "connected") {
    return body;                                    // 通了就只显示绿勾，不罗列
  }
  if (client.state === "not_installed") {
    body.appendChild(el("p", "lead", `本机还没装 ${client.display_name}，先到「安装 / 上手」页装上它。`));
    const b = el("button", "btn-secondary btn-sm", "去「安装 / 上手」页");
    b.dataset.act = "goto-install";
    body.appendChild(b);
    return body;
  }
  if (client.state === "unconfigured") {
    body.appendChild(el("p", "lead", "已经装好了，但还没配置连 AI Gate。"));
    const btn = el("button", "btn-primary btn-sm", "配置连接 AI Gate");
    btn.dataset.act = "toggle-config";
    const box = el("div", "hidden"); box.dataset.ctl = "configBox";
    body.append(btn, box);
    return body;
  }
  // blocked
  body.appendChild(el("p", "lead", client.detail || "当前配置连不上 AI Gate。"));
  const list = el("div");
  (client.issues || []).forEach((i) => list.appendChild(issueRow(client, i)));
  body.appendChild(list);
  const again = el("button", "rowlink", "处理完后，重新测这个客户端");
  again.dataset.act = "recheck";
  body.appendChild(again);
  return body;
}

function clientCard(client) {
  const card = el("section", "card client");
  card.dataset.client = client.client_id;
  const head = el("div", "chead");
  head.appendChild(el("span", "cname", client.display_name));
  const p = statePill(client);
  p.classList.add("cstate");
  head.appendChild(p);
  card.appendChild(head);
  card.appendChild(cardBody(client));
  return card;
}

/* ---------------- 检查 Tab：动作处理 ---------------- */

function findClientHost(clientId) {
  return Array.from($("results").querySelectorAll(".client"))
    .find((n) => n.dataset.client === clientId) || null;
}

function placeClient(client, extraMsg) {
  const fresh = clientCard(client);
  if (extraMsg) fresh.appendChild(extraMsg);
  const host = findClientHost(client.client_id);
  if (host && host.parentNode) host.replaceWith(fresh);
  else $("results").appendChild(fresh);
  return fresh;
}

function findIssueButton(card, issueId) {
  return Array.from(card.querySelectorAll("[data-issue]"))
    .find((n) => n.dataset.issue === issueId) || null;
}

async function actFix(card, clientId, issueId, getValue) {
  const btn = findIssueButton(card, issueId);
  if (btn) { btn.disabled = true; btn.textContent = "处理中…"; }
  let value;
  try { value = getValue ? getValue() : undefined; } catch (e) { value = undefined; }
  try {
    const r = await api("/api/action", { client_id: clientId, issue_id: issueId, value });
    const msg = el("div", "result " + (r.result === "fixed" ? "ok" : (r.result === "changed" ? "warn" : "bad")),
                   r.message);
    placeClient(r.client, msg);
  } catch (e) {
    const host = findClientHost(clientId);
    if (host) host.appendChild(el("div", "result bad", e.message));
    if (btn) { btn.disabled = false; btn.textContent = "重试"; }
  }
}

$("results").addEventListener("click", async (ev) => {
  const card = ev.target.closest(".client");
  if (!card) return;
  const clientId = card.dataset.client;
  const actEl = ev.target.closest("[data-act]");
  if (!actEl) return;
  const act = actEl.dataset.act;

  if (act === "recheck") {
    actEl.disabled = true;
    try {
      const r = await api("/api/recheck", { client_id: clientId });
      placeClient(r.client);
    } catch (e) {
      card.appendChild(el("div", "result bad", e.message));
      actEl.disabled = false;
    }
    return;
  }
  if (act === "goto-install") {
    switchTab("install");
    return;
  }
  if (act === "toggle-config") {
    const box = card.querySelector('[data-ctl="configBox"]');
    if (!box) return;
    if (box.classList.contains("hidden")) {
      box.classList.remove("hidden");
      box.replaceChildren(configurePanel());
    } else {
      box.classList.add("hidden");
    }
    return;
  }
  if (act === "configure") {
    const sel = card.querySelector('[data-ctl="cfgModel"]');
    const key = card.querySelector('[data-ctl="cfgKey"]');
    const model = sel ? sel.value : undefined;
    const apiKey = key ? key.value : "";
    if (!apiKey) {
      card.appendChild(el("div", "result bad", "要先把 Key 粘贴进来才能保存。"));
      return;
    }
    actEl.disabled = true; actEl.textContent = "正在保存并测试…";
    try {
      const r = await api("/api/configure", { client_id: clientId, model, api_key: apiKey });
      const msg = el("div", "result " + (r.client && r.client.state === "connected" ? "ok" : "warn"),
                     r.message + (r.path ? "\n配置写入：" + r.path : ""));
      placeClient(r.client, msg);
    } catch (e) {
      card.appendChild(el("div", "result bad", e.message));
      actEl.disabled = false; actEl.textContent = "保存并测试";
    }
    return;
  }

  // auto / choice / input 三种动作，共用 /api/action
  const issueId = actEl.dataset.issue;
  let getValue = null;
  if (act === "choice") {
    const sel = card.querySelector('[data-ctl="choiceSel"]');
    getValue = () => (sel ? sel.value : undefined);
  } else if (act === "input") {
    const inp = card.querySelector('[data-ctl="keyInput"]');
    getValue = () => {
      const v = inp ? inp.value : "";
      if (!v) throw new Error("empty");
      return v;
    };
  }
  actFix(card, clientId, issueId, getValue);
});

async function runCheck() {
  const btn = $("btnCheck");
  btn.disabled = true;
  $("results").replaceChildren();
  setStatus("busy", "正在检查…", "正在探测网关并逐个测试客户端连接。");
  try {
    const report = await api("/api/check", {});
    lastReport = report;

    const g = report.gateway;
    const gw = g ? `网关连通性：${g.ok ? "正常" : g.classification} · ${g.detail}（${g.elapsed_ms}ms）` : "";
    if (report.gateway_side_down) {
      setStatus("bad", "AI Gate 网关侧暂时连不上", report.message + (gw ? "　" + gw : ""));
    } else {
      const kind = report.result === "healthy" ? "ok" : "warn";
      setStatus(kind, report.message, gw);
    }
    (report.clients || []).forEach((c) => $("results").appendChild(clientCard(c)));
  } catch (e) {
    setStatus("bad", "检查失败", e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "开始检查";
  }
}

$("btnCheck").addEventListener("click", runCheck);

/* ---------------- Tab 切换 ---------------- */

function switchTab(name) {
  const check = name === "check";
  $("tabBtnCheck").classList.toggle("active", check);
  $("tabBtnInstall").classList.toggle("active", !check);
  $("panelCheck").classList.toggle("active", check);
  $("panelInstall").classList.toggle("active", !check);
  if (!check) renderInstall();
}
$("tabBtnCheck").addEventListener("click", () => switchTab("check"));
$("tabBtnInstall").addEventListener("click", () => switchTab("install"));

/* ---------------- 安装 / 上手 Tab ---------------- */

function installCard(c) {
  const card = el("section", "card");
  const head = el("div", "chead");
  head.appendChild(el("span", "cname", c.display_name));
  const pill = el("span", "pill " + (c.binary_installed ? "ok" : "muted") + " cstate",
                  c.binary_installed ? "已安装" : "未安装");
  head.appendChild(pill);
  card.appendChild(head);

  const body = el("div", "cbody");
  if (c.binary_installed) {
    body.appendChild(el("p", "lead", "已经能在这台机器上找到命令。"));
    if (c.install_guide) body.appendChild(el("div", "note", c.install_guide));
    card.appendChild(body);
    return card;
  }
  body.appendChild(el("p", "lead", "本机还没装。装好后回到「检查」页测连接。"));
  if (c.install_guide) body.appendChild(el("div", "note", c.install_guide));
  if (c.install_command) {
    body.appendChild(el("div", "codebox", c.install_command));
    const b = el("button", "btn-primary btn-sm", "运行安装命令");
    b.dataset.install = c.client_id;
    body.appendChild(b);
    const out = el("div", "outbox hidden");
    out.dataset.installOut = c.client_id;
    body.appendChild(out);
  }
  card.appendChild(body);
  return card;
}

function renderInstall() {
  const host = $("installList");
  host.replaceChildren(...STATE.clients.map(installCard));
}

$("installList").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("[data-install]");
  if (!btn) return;
  const clientId = btn.dataset.install;
  const out = $("installList").querySelector('[data-install-out="' + clientId + '"]');
  btn.disabled = true; btn.textContent = "正在安装…（可能需要几分钟）";
  if (out) { out.classList.remove("hidden"); out.textContent = "开始安装…"; }
  try {
    const r = await api("/api/install_run", { client_id: clientId });
    if (out) {
      out.textContent = (r.output || "") + (r.message ? "\n" + r.message : "");
      out.classList.toggle("err", r.ok === false);
    }
    $("installList").appendChild(el("div", "result " + (r.ok === false ? "bad" : "warn"),
      r.ok === false ? "安装没有成功，看上面的输出找原因。" : "命令已执行完。回「检查」页测一下能不能连上。"));
    await reloadState();
    renderInstall();            // 刷新已装/未装徽标
  } catch (e) {
    if (out) { out.textContent = e.message; out.classList.add("err"); }
    btn.disabled = false; btn.textContent = "重试安装";
  }
});

async function reloadState() {
  try {
    const s = await api("/api/state");
    STATE.models = s.models || [];
    STATE.clients = s.clients || [];
    $("sub").textContent = `${s.gateway_name || "AI Gate"} 连通体检 · 已接入 ${s.model_count || 0} 个型号`;
    $("foot").textContent = `规则来源：${s.profile_source}`;
  } catch (_) { /* 忽略，保留已有信息 */ }
}

reloadState();
</script>
</body>
</html>
